<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>glossa</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<!-- Phone layout: same width as narrowScreen in static/js/dom.js -->
<link rel="stylesheet" href="/static/mobile.css" media="(max-width: 700px)">
<meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>

<div id="topbar">
  <span class="brand" id="brand">glossa</span>

  <div id="topbar-reader-actions" class="topbar-actions" style="display:none">
    <button id="back-btn" class="btn btn-sm" aria-label="Back to the library">&larr;<span class="wide-only"> Library</span></button>
    <span id="reader-title"></span>
    <span id="page-indicator" class="hidden"></span>
    <label class="field-inline">
      <span class="wide-only">Translate to</span>
      <select id="target-lang-select" aria-label="Translate to">
      </select>
    </label>
  </div>

  <button id="settings-btn" class="btn btn-icon" title="Settings" aria-label="Settings">&#9881;</button>
</div>

<div id="library-view" class="view">
  <div class="library-toolbar">
    <label class="field-inline">
      Filter
      <select id="filter-lang-select" aria-label="Language">
        <option value="">All languages</option>
      </select>
      <select id="filter-kind-select" aria-label="Type">
        <option value="">All types</option>
        <option value="pdf">PDF</option>
        <option value="epub">EPUB</option>
        <option value="url">Article</option>
        <option value="video">Video</option>
      </select>
    </label>
    <button id="upload-open-btn" class="btn btn-sm btn-primary">Upload</button>
  </div>

  <ul id="text-list"></ul>
</div>

<div id="reader-view" class="view" style="display:none">
  <div id="reader-content"></div>

  <div id="pdf-reader" class="hidden">
    <div id="pdf-page"></div>
  </div>

  <div id="book-reader" class="hidden">
    <div id="book-viewport">
      <div id="book-content"></div>
    </div>
  </div>

  <div id="video-reader" class="hidden">
    <div id="video-stage">
      <div id="video-player-box"></div>
      <div id="video-error" class="hidden"></div>
    </div>
    <div id="cue-list"></div>
    <button id="video-follow-btn" class="btn hidden"></button>
  </div>
</div>

<button id="bookmark-jump-btn" class="btn btn-icon hidden" title="Go to bookmark" aria-label="Go to bookmark">&#128278;</button>
<button id="page-prev-btn" class="page-nav-btn page-nav-btn-left hidden" aria-label="Previous page">&larr;</button>
<button id="page-next-btn" class="page-nav-btn page-nav-btn-right hidden" aria-label="Next page">&rarr;</button>

<dialog id="upload-dialog">
  <h2>Upload text</h2>
  <div class="upload-mode-toggle" role="tablist">
    <button type="button" id="upload-mode-file-btn" class="btn btn-sm btn-primary" aria-pressed="true">File</button>
    <button type="button" id="upload-mode-url-btn" class="btn btn-sm" aria-pressed="false">Link</button>
    <button type="button" id="upload-mode-video-btn" class="btn btn-sm" aria-pressed="false">Video</button>
  </div>
  <form id="upload-form">
    <label class="field-block" id="file-field">
      File (.pdf or .epub)
      <input type="file" id="file-input" accept=".pdf,.epub" required>
    </label>
    <label class="field-block hidden" id="url-field">
      <span id="url-field-label">Article URL</span>
      <input type="url" id="url-input" placeholder="https://example.com/article">
    </label>
    <label class="field-block">
      Title
      <input type="text" id="title-input" placeholder="Title" required>
    </label>
    <label class="field-block">
      Source language
      <select id="source-lang-input">
      </select>
    </label>
    <div class="dialog-actions">
      <button type="button" id="upload-cancel-btn" class="btn">Cancel</button>
      <button type="submit" class="btn btn-primary">Upload</button>
    </div>
  </form>
</dialog>

<dialog id="delete-dialog">
  <h2>Delete text</h2>
  <p id="delete-dialog-message"></p>
  <div class="dialog-actions">
    <button type="button" id="delete-cancel-btn" class="btn">Cancel</button>
    <button type="button" id="delete-confirm-btn" class="btn btn-danger">Delete</button>
  </div>
</dialog>

<dialog id="edit-dialog">
  <h2>Edit text</h2>
  <form id="edit-form">
    <label class="field-block">
      Title
      <input type="text" id="edit-title-input" required>
    </label>
    <label class="field-block">
      Source language
      <select id="edit-source-lang-input">
      </select>
    </label>
    <div class="dialog-actions">
      <button type="button" id="edit-cancel-btn" class="btn">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog">
  <h2>Settings</h2>

  <fieldset>
    <legend>Theme</legend>
    <label class="field-radio"><input type="radio" name="theme" value="light"> Light</label>
    <label class="field-radio"><input type="radio" name="theme" value="default"> Default</label>
    <label class="field-radio"><input type="radio" name="theme" value="dark"> Dark</label>
  </fieldset>

  <fieldset id="font-settings-fieldset">
    <legend>Reading font</legend>
    <label class="field-block">
      Font family
      <select id="font-family-select">
        <option value="sans">Sans-serif</option>
        <option value="serif">Serif</option>
      </select>
    </label>
    <label class="field-block">
      Font size
      <select id="font-size-select">
        <option value="16">Small</option>
        <option value="18">Medium</option>
        <option value="21">Large</option>
        <option value="24">Extra large</option>
      </select>
    </label>
  </fieldset>

  <fieldset id="pdf-view-fieldset" hidden>
    <legend>View of this PDF</legend>
    <label class="field-radio"><input type="radio" name="pdf-view" value="reading"> Reading: the text laid out like a book</label>
    <label class="field-radio"><input type="radio" name="pdf-view" value="original"> Original: the pages as in the PDF</label>
  </fieldset>

  <div class="dialog-actions">
    <button type="button" id="settings-close-btn" class="btn btn-primary">Close</button>
  </div>
</dialog>

<div id="popup" class="hidden">
  <div id="popup-translation"></div>
  <button id="explain-btn" class="btn">Explain</button>
  <div id="explain-panel" class="hidden"></div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
